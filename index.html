<html>
<head>
    <title>Task App</title>
    <style>

    body {
        padding: 30px;
        background-color: lightblue;
    }
    h2 {
        color: darkblue;
    }
    input {
        padding: 8px;
        width: 300px;
        font-size: 20px;
    }
    button {
        padding: 8px;
        border-radius: 5px;
        background-color: blue;
        color: white;
        border: none;
        cursor: pointer;
        transition: 0.2s;
    }
    button:hover {
        opacity: 0.8;
        box-shadow: 0px 2px 5px gray;
    }
    li {
        padding: 10px;
        margin: 10px;
        font-size: 30px;
        width: 400px;
        opacity: 0.8;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: blue;
        background-color: red;
        border-radius: 5px;
    }
    li button {
        margin-left: 5px;
    }
    </style>
</head>
<body>

    <!--HTML-->

    <h2>Task Manager</h2>
    <input type = "text" id = "taskInput" placeholder = "Enter task">
    <button onclick="add_Task()">Add Task</button>
    <ul id="taskList"></ul>
    <script>

        const API = "https://task-manager-api-m0e7.onrender.com";

        async function add_Task() {

            const value = document.getElementById("taskInput").value;
            
            if (value == "") {
                console.log("Empty input");
            }
            else{
                console.log(value);
                await fetch(API + "/tasks", {
                    method: "POST" ,
                    headers: {
                        "Content-Type":"application/json"
                    },
                    body: JSON.stringify({task : value})

                });
            
            await loadTasks();

            }

            document.getElementById("taskInput").value = "";
        }

        async function loadTasks() {
            const res = await fetch(API);
            const data = await res.json();
            console.log(data)

            const list = document.getElementById("taskList");
            list.innerHTML = "";

            data.data.forEach(task => {
                const li = document.createElement("li");
                const btn = document.createElement("button");
                const editBtn = document.createElement("button");
                const statusbtn = document.createElement("button");
                li.textContent = task.task + "-" + task.status;
                btn.textContent = "delete";
                btn.addEventListener("click", async function() {
                    await fetch(`${API}/tasks/${task.id}`, {
                        method: "DELETE"
                    })
                    await loadTasks();
                })
                editBtn.textContent = "edit"
                editBtn.addEventListener("click", async function() {
                    const newTask = prompt("Enter new task")
                    await fetch(`${API}/tasks/${task.id}`,{
                    method: "PUT" ,
                    headers: {
                        "Content-Type":"application/json"
                    },
                    body: JSON.stringify({task : newTask,status : "pending"})
                    });
                    await loadTasks();

                })
                statusbtn.textContent = "complete"
                statusbtn.addEventListener("click", async function(){
                    await fetch(`${API}/tasks/${task.id}`,{
                        method: "PUT" ,
                        headers: {"Content-Type":"application/json"},
                        body: JSON.stringify({task : task.task,status : "Completed"})
                    })
                    await loadTasks();
                })

                list.appendChild(li);
                li.appendChild(btn);
                li.appendChild(editBtn);
                li.appendChild(statusbtn)

            
        });

        }

        loadTasks();
        
        
        
    </script>
</body>
</html>
